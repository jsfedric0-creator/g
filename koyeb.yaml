FROM debian:bullseye-slim

# Install dependencies
RUN apt-get update && apt-get install -y \
    wget \
    gnupg \
    ca-certificates \
    && rm -rf /var/lib/apt/lists/*

# Add Flussonic repository
RUN wget -q -O - http://debian.erlyvideo.org/binary/gpg.key | apt-key add - \
    && echo "deb http://debian.erlyvideo.org binary/" >> /etc/apt/sources.list

# Install Flussonic
RUN apt-get update && apt-get install -y flussonic

# Create configuration directory
RUN mkdir -p /etc/flussonic

# Create a basic configuration file
RUN echo "http 0.0.0.0:80;" > /etc/flussonic/flussonic.conf && \
    echo "stream test { input fake://fake; }" >> /etc/flussonic/flussonic.conf

# Fix the startup script permissions and issues
RUN chmod +x /opt/flussonic/bin/run && \
    sed -i '/ulimit -n/d' /opt/flussonic/bin/run && \
    sed -i '/sysctl/d' /opt/flussonic/bin/run && \
    sed -i '/rp_filter/d' /opt/flussonic/bin/run

# Use the correct Flussonic executable
# Test if /usr/bin/flussonic exists, otherwise use /opt/flussonic/bin/flussonic
RUN if [ -f /usr/bin/flussonic ]; then echo "flussonic found at /usr/bin/flussonic"; else echo "Using /opt/flussonic/bin/flussonic"; fi

# Expose ports
EXPOSE 80 443 1935 554 8080

# CORRECT CMD - Try different executable paths
CMD ["/opt/flussonic/bin/flussonic", "/etc/flussonic/flussonic.conf"]
